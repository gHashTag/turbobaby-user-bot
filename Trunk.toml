[build]
target = "index.html"
dist = "dist"
public_url = "/"
filehash = true
release = true
# Skip wasm-opt: prebuilt v116 doesn't allow bulk-memory/nontrapping-fptoint
# features that modern rustc emits. cargo --release already optimizes well.
no_opt = true

[serve]
addresses = ["127.0.0.1", "0.0.0.0"]
port = 8080
open = false

[clean]
dist = "dist"
cargo = false

[tools]
wasm-bindgen = "0.2.95"

[watch]
watch = ["src", "assets"]
ignore = ["dist"]

[[copy-dir]]
path = "assets"
