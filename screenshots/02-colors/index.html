<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>02 · Colors</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f1a;--bg2:#1a1a2e;--card:#16213e;--border:#2a2a4a;--text:#e8e8e8;--text2:#8b8b9e;--green:#39ff14;--cyan:#00e5ff;--yellow:#ffe600;--purple:#b388ff;--red:#ff4757;--orange:#ff9f43;--radius-sm:4px;--radius-md:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding:24px;}
h1{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--cyan);margin-bottom:24px;text-transform:uppercase;letter-spacing:2px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;}
.swatch{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);}
.preview{height:50px;}
.info{padding:6px 8px;background:var(--card);}
.name{font-size:9px;font-weight:600;}
.hex{font-size:8px;color:var(--text2);font-family:monospace;}
</style></head><body>
<h1>02 · Color Palette</h1>
<div class="grid">
<div class="swatch"><div class="preview" style="background:#0f0f1a"></div><div class="info"><div class="name">Background</div><div class="hex">#0f0f1a</div></div></div>
<div class="swatch"><div class="preview" style="background:#1a1a2e"></div><div class="info"><div class="name">Surface</div><div class="hex">#1a1a2e</div></div></div>
<div class="swatch"><div class="preview" style="background:#16213e"></div><div class="info"><div class="name">Card</div><div class="hex">#16213e</div></div></div>
<div class="swatch"><div class="preview" style="background:#2a2a4a"></div><div class="info"><div class="name">Border</div><div class="hex">#2a2a4a</div></div></div>
<div class="swatch"><div class="preview" style="background:#39ff14"></div><div class="info"><div class="name">Green</div><div class="hex">#39ff14</div></div></div>
<div class="swatch"><div class="preview" style="background:#00e5ff"></div><div class="info"><div class="name">Cyan</div><div class="hex">#00e5ff</div></div></div>
<div class="swatch"><div class="preview" style="background:#ffe600"></div><div class="info"><div class="name">Yellow</div><div class="hex">#ffe600</div></div></div>
<div class="swatch"><div class="preview" style="background:#b388ff"></div><div class="info"><div class="name">Purple</div><div class="hex">#b388ff</div></div></div>
<div class="swatch"><div class="preview" style="background:#ff4757"></div><div class="info"><div class="name">Red</div><div class="hex">#ff4757</div></div></div>
<div class="swatch"><div class="preview" style="background:#ff9f43"></div><div class="info"><div class="name">Orange</div><div class="hex">#ff9f43</div></div></div>
<div class="swatch"><div class="preview" style="background:#e8e8e8"></div><div class="info"><div class="name">Text</div><div class="hex">#e8e8e8</div></div></div>
<div class="swatch"><div class="preview" style="background:#8b8b9e"></div><div class="info"><div class="name">Muted</div><div class="hex">#8b8b9e</div></div></div>
</div></body></html>
