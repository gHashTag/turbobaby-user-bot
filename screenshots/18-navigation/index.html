<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18 - Navigation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: 'Press Start 2P', monospace;
    padding: 24px;
  }
  .section-title {
    color: #39ff14;
    font-size: 14px;
    margin-bottom: 20px;
    text-shadow: 0 0 8px rgba(57,255,20,0.5);
    border-bottom: 2px solid #39ff14;
    padding-bottom: 8px;
  }
  .nav-section {
    max-width: 400px;
    margin: 0 auto 32px;
  }
  .section-label {
    font-size: 8px;
    color: #00e5ff;
    margin-bottom: 12px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #1a1a2e;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
  }
  .header-logo {
    font-size: 12px;
    color: #39ff14;
    text-shadow: 0 0 8px rgba(57,255,20,0.5);
  }
  .header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .header-icon {
    font-size: 16px;
    cursor: pointer;
    position: relative;
  }
  .header-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 14px;
    height: 14px;
    background: #ff4444;
    border-radius: 50%;
    font-size: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }

  /* Bottom Navigation */
  .bottom-nav {
    display: flex;
    background: #1a1a2e;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.1);
    overflow: hidden;
    padding: 8px 4px;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-item.active {
    background: rgba(57,255,20,0.1);
    border-radius: 12px;
  }
  .nav-icon {
    font-size: 20px;
  }
  .nav-label {
    font-size: 6px;
    color: #666;
  }
  .nav-item.active .nav-label {
    color: #39ff14;
  }

  /* Breadcrumbs */
  .breadcrumbs {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 8px;
  }
  .breadcrumb-item {
    color: #666;
    cursor: pointer;
  }
  .breadcrumb-item:hover { color: #00e5ff; }
  .breadcrumb-sep { color: #333; }
  .breadcrumb-current { color: #39ff14; }

  /* Tab header */
  .tab-header {
    display: flex;
    border-bottom: 2px solid rgba(255,255,255,0.1);
  }
  .tab-header-item {
    flex: 1;
    padding: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: #666;
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: center;
    position: relative;
  }
  .tab-header-item.active {
    color: #39ff14;
  }
  .tab-header-item.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    right: 0;
    height: 2px;
    background: #39ff14;
    box-shadow: 0 0 8px rgba(57,255,20,0.5);
  }
</style>
</head>
<body>
  <div class="section-title">NAVIGATION — App Navigation</div>

  <div class="nav-section">
    <div class="section-label">Header Bar</div>
    <div class="header">
      <div class="header-logo">🏍 TURBOBABY</div>
      <div class="header-actions">
        <span class="header-icon">🔍</span>
        <span class="header-icon">🔔</span>
        <span class="header-icon">🛒<span class="header-badge">3</span></span>
      </div>
    </div>
  </div>

  <div class="nav-section">
    <div class="section-label">Bottom Navigation</div>
    <div class="bottom-nav">
      <div class="nav-item active">
        <span class="nav-icon">🏍️</span>
        <span class="nav-label">Bikes</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">🏁</span>
        <span class="nav-label">Ride</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Orders</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">🛒</span>
        <span class="nav-label">Cart</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profile</span>
      </div>
    </div>
  </div>

  <div class="nav-section">
    <div class="section-label">Breadcrumbs</div>
    <div class="breadcrumbs">
      <span class="breadcrumb-item">Home</span>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-item">Bikes</span>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">Yamaha NMAX 155</span>
    </div>
  </div>

  <div class="nav-section">
    <div class="section-label">Tab Header</div>
    <div class="tab-header">
      <button class="tab-header-item active">Details</button>
      <button class="tab-header-item">Reviews</button>
      <button class="tab-header-item">Related</button>
    </div>
  </div>
</body>
</html>
