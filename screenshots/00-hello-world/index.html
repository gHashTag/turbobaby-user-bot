<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>00 - Hello World</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
  }
  .hello-container {
    text-align: center;
    padding: 40px;
  }
  .hello-container h1 {
    color: #39ff14;
    font-size: 36px;
    text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14, 0 0 40px #39ff14, 0 0 80px #39ff14;
    animation: flicker 2s infinite alternate;
  }
  .hello-container p {
    color: #00e5ff;
    font-size: 12px;
    margin-top: 24px;
    text-shadow: 0 0 8px #00e5ff;
  }
  .pixel-border {
    border: 4px solid #39ff14;
    padding: 60px 80px;
    box-shadow: 0 0 20px rgba(57,255,20,0.3), inset 0 0 20px rgba(57,255,20,0.1);
    image-rendering: pixelated;
  }
  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.8; }
  }
</style>
</head>
<body>
  <div class="hello-container pixel-border">
    <h1>Hello World</h1>
    <p>TurboBaby v1.0</p>
  </div>
</body>
</html>
