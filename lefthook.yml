# Lefthook 2.1.9 — Git hooks for turbobaby-bot.
#
# Replaces the hand-written `.githooks/pre-commit`. Mirrors the same checks
# but runs them through lefthook so each command can fail/skip independently
# (and `glob:` filters skip `cargo fmt` when no .rs files are staged).
#
# Setup for new clones:
#   brew install lefthook
#   lefthook install
#
# To opt out temporarily: LEFTHOOK=0 git commit ...

# pre-push — defense in depth. block-main in pre-commit prevents *committing*
# on main, but git also lets you commit on a feature branch and then push it
# straight to `refs/heads/main`. This hook closes that gap.
pre-push:
  commands:
    block-push-to-main:
      # Git passes one line per push ref on stdin in the form:
      #   <local_ref> <local_sha> <remote_ref> <remote_sha>
      # Read each line, fail if any pushes to refs/heads/main.
      run: |
        while read local_ref local_sha remote_ref remote_sha; do
          if [ "$remote_ref" = "refs/heads/main" ]; then
            echo ""
            echo "❌  Pushing directly to \`main\` is blocked."
            echo "   Open a pull request instead."
            echo ""
            exit 1
          fi
        done

    full-tests:
      # pre-commit runs only the defensive slice (db:: + metric wiring) to keep
      # commits fast. That leaves ~780 unit tests — including every pricing,
      # checkout-gate and callback-routing test — running nowhere before code
      # reaches main. They take under a second once compiled, so the only
      # sensible place for them is here.
      run: cargo test --offline --features backend --lib --quiet
      fail_text: |
        Unit tests failed. Run `cargo test --features backend --lib` to see them.

    clippy-backend:
      # clippy has caught real defects here (an unused admin-gate helper that
      # revealed three copy-pasted guards). It ran in no hook at all.
      run: cargo clippy --offline --features backend --bin turbobaby-bot-server -- -D warnings
      fail_text: |
        clippy failed on the server binary. Fix the lints before pushing.

    integration-tests:
      # DB-backed suites — orders, stars, catalog, garden, events, strain-of-day.
      # Skipped when DATABASE_URL is unset so a clone without Postgres can still
      # push; when it IS set, these are the tests that have caught every
      # production defect this month, so they must not be optional.
      run: |
        if [ -z "$DATABASE_URL" ]; then
          echo "  DATABASE_URL unset — skipping DB-backed integration tests."
          exit 0
        fi
        cargo test --offline --features backend --tests --quiet -- --include-ignored --test-threads=1
      fail_text: |
        Integration tests failed against $DATABASE_URL.

    frontend-smoke:
      # When a rebuilt WASM bundle is in the push, prove it actually LOADS in a
      # browser before it can ship. cargo/trunk only COMPILE the wasm + emit the
      # wasm-bindgen glue — they never execute it, so module-load failures (e.g.
      # a CLI/crate version skew → "Importing binding name X is not found")
      # sail through every green check and break prod (2026-06-18 incident).
      # --no-build validates the committed dist/ as-is. Needs Chrome + python3
      # websocket-client locally; skip with LEFTHOOK=0 if unavailable.
      glob: "dist/*_bg.wasm"
      run: ./scripts/predeploy-smoke.sh --no-build
      fail_text: |
        Frontend smoke test failed — the committed WASM bundle does not load in a
        browser. Do NOT push. See scripts/predeploy-smoke.sh output above.

    deploy-heads-up:
      # Announce the deploy so admins know what to test. ALWAYS prints the tip
      # commit locally; ALSO pings Telegram if DEPLOY_NOTIFY_BOT_TOKEN +
      # DEPLOY_NOTIFY_CHAT_ID are set in the env (export them in your shell, e.g.
      # the bot token + an admin chat id). The backend ALSO notifies admins on
      # successful boot (notify::notify_deploy) with the full commit detail —
      # that's the reliable "deploy SUCCEEDED" signal; this is the immediate
      # "deploy STARTING" heads-up. Best-effort: never blocks the push.
      run: |
        subject="$(git log -1 --pretty=%s)"
        sha="$(git rev-parse --short HEAD)"
        echo "🚀 Deploy heads-up: $sha — $subject"
        if [ -n "$DEPLOY_NOTIFY_BOT_TOKEN" ] && [ -n "$DEPLOY_NOTIFY_CHAT_ID" ]; then
          curl -fsS -X POST "https://api.telegram.org/bot${DEPLOY_NOTIFY_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${DEPLOY_NOTIFY_CHAT_ID}" \
            --data-urlencode "text=🚀 Деплой запущен: ${sha} — ${subject}. Через ~5 мин проверьте этот раздел." \
            >/dev/null 2>&1 || echo "  (deploy ping failed — ignoring)"
        fi
        exit 0

# commit-msg — enforce Conventional Commits format so the changelog / release
# tooling can parse the history without manual triage. Migrated from
# .githooks/commit-msg (cycle #53).
commit-msg:
  commands:
    conventional-commits:
      # Lefthook substitutes {1} with the first command arg, which for the
      # commit-msg hook is the path to the commit message file.
      run: |
        msg_file="{1}"
        msg=$(head -n1 "$msg_file")
        # Allow merge / revert / branch-as-message commits unchanged.
        if echo "$msg" | grep -qE '^(Merge|Revert|branch)'; then
          exit 0
        fi
        if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|wip)(\([^)]+\))?: .+'; then
          echo ""
          echo "❌  Commit message does not follow Conventional Commits."
          echo "   Expected: type(scope): description"
          echo "   Types: feat | fix | docs | style | refactor | test | chore | ci | build | perf | wip"
          echo "   Example: feat(menu): add filter by strain type"
          echo ""
          exit 1
        fi

pre-commit:
  parallel: false
  commands:
    block-main:
      # Mirrors `.githooks/pre-commit`: forbid direct commits to main so all
      # changes go through PRs. Lefthook prints `tags` and skips silently if
      # the branch isn't main, so this is a no-op on feature branches.
      run: |
        branch="$(git rev-parse --abbrev-ref HEAD)"
        if [ "$branch" = "main" ]; then
          echo ""
          echo "❌  Direct commits to \`main\` are blocked."
          echo "   Create a feature branch: git checkout -b feat/your-change"
          echo ""
          exit 1
        fi

    fmt:
      # Glob filter: lefthook skips the entire command if no staged file
      # matches, so non-Rust commits don't pay the cargo-fmt startup tax.
      glob: "*.rs"
      run: cargo fmt -- --check
      fail_text: |
        cargo fmt --check failed. Run `cargo fmt` to fix.

    check-backend:
      run: cargo check --features backend
      fail_text: |
        Backend compilation failed. Fix errors before committing.

    check-wasm:
      run: cargo check --target wasm32-unknown-unknown
      fail_text: |
        WASM compilation failed. Fix errors before committing.

    # Cycles #104 + #109: pre-commit catches for cheap defensive tests.
    # Currently covers two structural-drift suites:
    #   - `db::*` — schema-truth triad (#101 manifest, #102 entity
    #     columns, #103 orphan tables) + pure db helpers (55 tests)
    #   - `metrics::metric_wiring` — declared-but-unwired metric audit
    #     (#108, 1 test)
    # All are pure (file IO + grep, no DB, no network) and sub-second
    # after the first compile. Without this hook a dev could break a
    # defensive test and only learn about it from CI post-push. This
    # step also compiles the test harness, catching broken test code
    # that `cargo check` alone misses. Total impact: ~1s incremental,
    # ~5s cold. To add another module, append its filter to the `--`
    # arg list (libtest treats positional args as an OR-of-substring
    # filters; `cargo test` itself only takes one TESTNAME).
    defensive-tests:
      # Run when *.rs or *.sql changes — migration SQL drift is exactly
      # what the manifest/orphan tests catch, so we can't skip on
      # SQL-only commits.
      glob:
        - "*.rs"
        - "*.sql"
      run: "cargo test --offline --features backend --bin turbobaby-bot-server --quiet -- db:: metrics::metric_wiring"
      fail_text: |
        Defensive tests failed (schema-truth triad / metric wiring / pure helpers).
        Run `cargo test --features backend --bin turbobaby-bot-server -- db:: metrics::metric_wiring`
        locally to see the failure details.
