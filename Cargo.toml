[workspace]
[package]
name = "woody-weed-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "woody-weed-bot"
path = "src/main.rs"

[dependencies]
# Telegram bot framework
teloxide = { version = "0.13", features = ["macros", "webhooks-axum"] }

# HTTP server (replaces Express)
axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate", "bigdecimal"], default-features = false }

# HTTP client (for AI APIs)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Environment variables
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.21"
anyhow = "1"
thiserror = "1"

# S3
aws-config = "1"
aws-sdk-s3 = "1"

# Image processing (replaces sharp)
image = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
