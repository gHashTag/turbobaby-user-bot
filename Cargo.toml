[workspace]
[package]
name = "woody-weed-bot"
version = "0.1.0"
edition = "2021"
# Cycle #115: not published to crates.io. cargo-deny respects this
# to skip the unlicensed-crate check on our workspace member.
publish = false

[[bin]]
name = "woody-weed-bot"
path = "src/web.rs"

[[bin]]
name = "woody-weed-bot-server"
path = "src/main.rs"
required-features = ["backend"]

[lib]
name = "woody_weed_bot"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Web UI (WASM compatible) - always included
dioxus = { version = "0.6", default-features = false, features = ["web", "router", "macro", "html", "signals", "hooks", "launch", "mounted", "file_engine", "document", "asset", "warnings", "cli-config"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"
gloo-events = "0.3"
reqwest = { version = "0.11", features = ["json"], default-features = false, optional = true }
web-sys = { version = "0.3", features = [
    "Window", "Storage", "Navigator", "Clipboard", "Location",
    "Document", "Element", "HtmlElement", "Event", "EventTarget",
    "KeyboardEvent", "MouseEvent", "console", "Url"
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

# OpenAPI documentation (backend only)
utoipa = { version = "5", features = ["axum_extras"], optional = true }

# Backend only dependencies - all optional
teloxide = { version = "0.17", features = ["macros", "webhooks-axum", "rustls"], default-features = false, optional = true }
axum = { version = "0.7", features = ["multipart"], optional = true }
axum-prometheus = { version = "0.7", optional = true }
metrics = { version = "0.23", optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "set-header", "compression-br", "compression-gzip", "compression-zstd"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
# Cycle #96: tokio-postgres / deadpool-postgres / postgres-types /
# tokio-postgres-rustls dropped after the 17-cycle SeaORM migration
# (#79–#96). SeaORM uses sqlx-postgres internally with its own pool;
# the parallel deadpool path is gone. `rustls` stays only for the
# explicit `crypto::ring::default_provider().install_default()` call
# in main.rs — `runtime-tokio-rustls` brings rustls transitively but
# the explicit provider install needs the direct dep.
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"], default-features = false, optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
aws-config = { version = "1", default-features = false, features = ["rustls"], optional = true }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls"], optional = true }
aws-smithy-async = { version = "1", features = ["rt-tokio"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
url = { version = "2", optional = true }

bytes = "1"

# Shared dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "js", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
constant_time_eq = "0.3"
rand = "0.8"
base64 = "0.21"
anyhow = "1"
thiserror = "1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
urlencoding = "2.1.3"

# WASM-only: gloo-net is a thin web_sys/fetch wrapper, ~300KB smaller than
# reqwest in the resulting .wasm bundle. Used by the lightweight HTTP helper
# in `src/ui/api/http.rs`; reqwest is still kept as the migration target
# proceeds gradually.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", features = ["http"] }

[features]
default = []
backend = [
    "teloxide", "axum", "tower", "tower-http", "tokio",
    "rustls",
    "sea-orm",
    "reqwest",
    "aws-config", "aws-sdk-s3", "aws-smithy-async", "tracing-subscriber", "url",
    "axum-prometheus",
    "metrics",
    "utoipa"
]
web = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

