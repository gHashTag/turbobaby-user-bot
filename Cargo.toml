[workspace]
[package]
name = "woody-weed-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "woody-weed-bot"
path = "src/main.rs"

[dependencies]
teloxide = { version = "0.13", features = ["macros", "webhooks-axum", "rustls"], default-features = false }

axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

tokio = { version = "1", features = ["full"] }

# Database with rustls TLS support
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
postgres-types = { version = "0.2", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"

reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

dotenvy = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.21"
anyhow = "1"
thiserror = "1"

aws-config = { version = "1", default-features = false, features = ["rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls"] }

image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
