[workspace]
[package]
name = "woody-weed-bot"
version = "0.1.0"
edition = "2021"
# Cycle #115: not published to crates.io. cargo-deny respects this
# to skip the unlicensed-crate check on our workspace member.
publish = false

[package.metadata.cargo-machete]
# Cycle #119: `getrandom` is a direct dep only to thread the `js`
# feature into the transitive chain. machete can't see feature-only
# usage so it flags it as unused.
ignored = ["getrandom"]

[lints.rust]
# Compiler-enforced visibility hygiene. Cycle ~#190: after four cycles
# of pub→pub(crate) tightening (db, api, bot+ai, pub-mod) brought the
# count from 189 to 0 (with 17 documented #[allow] attributes on items
# that are structurally pub: SeaORM Models, cross-boundary types,
# main.rs entry points), enabling this lint freezes the status quo so
# new pub items must use pub(crate) from the start. CI's
# `clippy -- -D warnings` upgrades violations to errors.
unreachable_pub = "warn"

[lints.clippy]
# Block new `.unwrap()` in production code. Audit done in cycle after
# eb82068: prod-side backend code has zero unwrap() calls; the 6
# remaining `.expect("rationale")` callsites are panic-on-bug idioms
# (parse a static URL, install rustls provider, tokio signal handlers)
# and are kept. The bin and wasm-lib clippy invocations both run with
# `-D warnings` in CI, so any new `.unwrap()` in production code
# becomes a hard compile error. Test code is unaffected (the bin/lib
# clippy targets don't compile tests).
unwrap_used = "warn"
# Block new `.expect()` in production code unless explicitly opted into
# via `#[allow(clippy::expect_used)]` with a rationale comment. The 5
# functions in this crate that use .expect() (cache.rs::compute_hash,
# main.rs::main, main.rs::shutdown_signal, bot/mod.rs::{web_app_btn,
# url_btn}) all carry such an allow attribute with the structural
# reason. New callsites must follow suit or refactor to ? / match.
expect_used = "warn"

[[bin]]
name = "woody-weed-bot"
path = "src/web.rs"

[[bin]]
name = "woody-weed-bot-server"
path = "src/main.rs"
required-features = ["backend"]

[lib]
name = "woody_weed_bot"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Web UI (WASM compatible) - always included
dioxus = { version = "0.6", default-features = false, features = ["web", "router", "macro", "html", "signals", "hooks", "launch", "mounted", "file_engine", "document", "asset", "warnings", "cli-config"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"
gloo-events = "0.3"
reqwest = { version = "0.11", features = ["json"], default-features = false, optional = true }
web-sys = { version = "0.3", features = [
    "Window", "Storage", "Navigator", "Clipboard", "Location",
    "Document", "Element", "HtmlElement", "Event", "EventTarget",
    "KeyboardEvent", "MouseEvent", "console", "Url"
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Cycle #119: declared as a direct dep purely to enable the `js`
# feature flag so the transitive `rand` -> `rand_core` -> `getrandom`
# chain has a browser entropy source on the WASM target. No
# `use getrandom::*` in src/ — `cargo machete` flags it; documented
# below in `[package.metadata.cargo-machete]`.
getrandom = { version = "0.2", features = ["js"] }

# OpenAPI documentation (backend only)
utoipa = { version = "5", features = ["axum_extras"], optional = true }

# Backend only dependencies - all optional
teloxide = { version = "0.17", features = ["macros", "webhooks-axum", "rustls"], default-features = false, optional = true }
axum = { version = "0.7", features = ["multipart"], optional = true }
axum-prometheus = { version = "0.7", optional = true }
metrics = { version = "0.23", optional = true }
# Cycle #119: `tower` direct dep dropped — only `tower_http::*` is
# actually `use`d (cors, fs, trace, set-header). tower 0.4 still flows
# in transitively via axum-prometheus and tower-http themselves, so
# the binary is unchanged.
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "set-header", "compression-br", "compression-gzip", "compression-zstd"], optional = true }
# Cycle #125: `test-util` enables `tokio::test(start_paused = true)` and
# `tokio::time::advance` for testing time-driven loops (spawn_ttl_sweep).
# The feature is cfg-gated to `#[cfg(test)]` internally so the production
# binary doesn't grow.
tokio = { version = "1", features = ["full", "test-util"], optional = true }
# Cycle #96: tokio-postgres / deadpool-postgres / postgres-types /
# tokio-postgres-rustls dropped after the 17-cycle SeaORM migration
# (#79–#96). SeaORM uses sqlx-postgres internally with its own pool;
# the parallel deadpool path is gone. `rustls` stays only for the
# explicit `crypto::ring::default_provider().install_default()` call
# in main.rs — `runtime-tokio-rustls` brings rustls transitively but
# the explicit provider install needs the direct dep.
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"], default-features = false, optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
aws-config = { version = "1", default-features = false, features = ["rustls"], optional = true }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls"], optional = true }
aws-smithy-async = { version = "1", features = ["rt-tokio"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
# Cycle #119: `url` direct dep dropped — no `use url::*` anywhere in
# src/. Still flows in transitively via aws-config / aws-sdk-s3 /
# reqwest / sea-orm / dioxus-router, so the binary is unchanged.

bytes = "1"

# Shared dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "js", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
constant_time_eq = "0.3"
rand = "0.8"
base64 = "0.21"
anyhow = "1"
thiserror = "1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
urlencoding = "2.1.3"

# WASM-only: gloo-net is a thin web_sys/fetch wrapper, ~300KB smaller than
# reqwest in the resulting .wasm bundle. Used by the lightweight HTTP helper
# in `src/ui/api/http.rs`; reqwest is still kept as the migration target
# proceeds gradually.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", features = ["http"] }

[features]
default = []
backend = [
    "teloxide", "axum", "tower-http", "tokio",
    "rustls",
    "sea-orm",
    "reqwest",
    "aws-config", "aws-sdk-s3", "aws-smithy-async", "tracing-subscriber",
    "axum-prometheus",
    "metrics",
    "utoipa"
]
web = []

# Cycle #162: dev-only deps for integration tests under `tests/`.
# `tower::ServiceExt::oneshot` is the canonical way to exercise an Axum
# `Router` without spinning up a real TCP listener. Cycle #119 removed
# `tower` as a runtime dep (only `tower_http::*` was used); this is a
# separate dev-only re-introduction.
[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

