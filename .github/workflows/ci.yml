name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

# The server binary is `turbobaby-bot-server`, per DECISIONS.md D4 (package
# woody-weed-bot -> turbobaby-bot, lib woody_weed_bot -> turbobaby_bot, bin
# woody-weed-bot-server -> turbobaby-bot-server). Two jobs below name it
# explicitly, so both fail loudly if the Cargo.toml rename is reverted rather
# than silently linting a target that no longer exists.

jobs:
  check:
    name: Check + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # Formatting was enforced only by `lefthook.yml`'s `fmt` step until
      # 2026-09-16, and a git hook is not a gate: it lives in `.git/hooks`,
      # which no clone gets for free. `lefthook install` is a line in the
      # README that a fresh checkout has not run, `--no-verify` skips it, and
      # so does any commit made by tooling. Nothing downstream re-checked, so
      # unformatted code reached the default branch green.
      #
      # First in the job on purpose: it costs seconds and needs no build, so a
      # whitespace slip fails before the compile rather than after it.
      - run: cargo fmt -- --check
      - run: cargo check --features backend
      - run: cargo test --features backend
      # Cycle #113: after the #110-#112 cleanup got both targets to zero
      # clippy warnings (165 -> 0 on WASM, 4 -> 0 on backend), gate
      # future PRs to keep them clean. `-D warnings` fails the build on
      # any new lint.
      - run: cargo clippy --features backend --bin turbobaby-bot-server -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings

  build-wasm:
    name: Build WASM (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --target=wasm32-unknown-unknown --release

  build-backend:
    name: Build Backend (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl --features backend --bin turbobaby-bot-server

  # Cycle #107: dependency vulnerability scan. Ignores are documented
  # in docs/SECURITY_AUDIT.md with rationale per advisory. A NEW
  # advisory not in the ignore list fails the job — forcing either a
  # real fix or an explicit policy decision (add to ignores + doc).
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0258

  # Cycle #115: license / ban / source / advisory policy enforcement.
  # Companion to `audit` above — `cargo audit` covers vulnerability
  # advisories, `cargo deny` adds license allowlist, multi-version
  # dup detection, and unknown-registry refusal. Config in deny.toml.
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-deny
      - run: cargo deny check

  # Cycle #119: unused-dependency audit. machete is a string-grep
  # heuristic — it flags `getrandom` (feature-unification dep, see
  # `[package.metadata.cargo-machete] ignored = [...]` in Cargo.toml)
  # as a false positive, ignored via that metadata. Any *new* direct
  # dep added without a `use` reference fails this job.
  machete:
    name: Cargo Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-machete
      - run: cargo machete

  # Seed provenance. `data/fleet_seed.json` records where every published
  # number came from; `migrations/082_bikes_seed.sql` is what actually reaches
  # the database. Nothing but habit kept them equal, and the drift is silent in
  # the direction that matters: a price edited in the SQL and not the JSON is
  # served to a customer under a provenance note that no longer describes it.
  # The checker already existed and ran in no workflow; this wires it. Python
  # stdlib only, so no toolchain and no new dependency.
  seed:
    name: Fleet Seed Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_fleet_seed.py -v

  t27-contracts:
    name: T27 Canonical Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out pinned external T27 compiler
        uses: actions/checkout@v4
        with:
          repository: gHashTag/t27
          ref: 40003ed1379c8a417e13e45843de35088b88f8c0
          path: .t27-toolchain
      - name: Build pinned compiler
        run: cargo build --locked --release --manifest-path .t27-toolchain/Cargo.toml -p t27c
      - name: Parse, typecheck, test and generate every canonical contract
        env:
          T27C: .t27-toolchain/target/release/t27c
        run: python3 scripts/verify_t27_specs.py --require-compiler -v
