name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo check --features backend
      - run: cargo test --features backend
      # Cycle #113: after the #110-#112 cleanup got both targets to zero
      # clippy warnings (165 -> 0 on WASM, 4 -> 0 on backend), gate
      # future PRs to keep them clean. `-D warnings` fails the build on
      # any new lint.
      - run: cargo clippy --features backend --bin woody-weed-bot-server -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings

  build-wasm:
    name: Build WASM (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --target=wasm32-unknown-unknown --release

  build-backend:
    name: Build Backend (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl --features backend --bin woody-weed-bot-server

  # Cycle #107: dependency vulnerability scan. Ignores are documented
  # in docs/SECURITY_AUDIT.md with rationale per advisory. A NEW
  # advisory not in the ignore list fails the job — forcing either a
  # real fix or an explicit policy decision (add to ignores + doc).
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104
