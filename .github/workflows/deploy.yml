name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Trunk mirrors root assets into dist/assets/, and the backend already
          # serves /assets from the root assets/ directory. Removing the duplicate
          # cuts the Railway upload by ~130 MB and avoids the recent 502/413 errors.
          rm -rf dist/assets
          railway up --service woody-weed-bot
