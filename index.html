<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Woody Weed Bot</title>
    <link rel="icon" href="/assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link data-trunk rel="css" href="styles/variables.css"/>
    <link data-trunk rel="css" href="styles/main.css"/>
    <link data-trunk rel="css" href="styles/admin.css"/>
    <link data-trunk rel="copy-dir" href="assets" data-target-path="assets"/>
    <link data-trunk rel="rust" data-target-name="woody_weed_bot" data-wasm-opt="0" />
    <style>
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #preloader.hidden { display: none; }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid #2a2a4a;
            border-top-color: #39ff14;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            margin-top: 16px;
            color: #39ff14;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
    <script>
    // 3D Comet Card tilt effect (matching old React bot exactly)
    document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('mousemove', function(e) {
            if (!e || !e.target) { return; }
            var target = e.target;
            // Find closest element with .comet-card class
            while (target && target !== document) {
                if (target.classList && target.classList.contains('comet-card')) {
                    var card = target;
                    var rect = card.getBoundingClientRect();
                    var x = (e.clientX - rect.left) / rect.width - 0.5;
                    var y = (e.clientY - rect.top) / rect.height - 0.5;
                    card.style.transform = 'perspective(800px) rotateY(' + (x * 12) + 'deg) rotateX(' + (-y * 12) + 'deg) scale3d(1.02, 1.02, 1.02)';
                    return;
                }
                target = target.parentNode;
            }
        });
        document.addEventListener('mouseleave', function(e) {
            if (!e || !e.target) { return; }
            var target = e.target;
            while (target && target !== document) {
                if (target.classList && target.classList.contains('comet-card')) {
                    target.style.transform = '';
                    return;
                }
                target = target.parentNode;
            }
        }, true);
    });
    </script>
</head>
<body>
    <div id="preloader">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка...</div>
    </div>
    <div id="main"></div>
    <script>
        // Hide preloader when app mounts
        window.addEventListener('load', function() {
            setTimeout(function() {
                var preloader = document.getElementById('preloader');
                if (preloader) preloader.classList.add('hidden');
            }, 500);
        });
    </script>
</body>
</html>
