<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Static Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #39ff14;
            font-size: 60px;
            margin-bottom: 30px;
        }
        .checklist {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #39ff14;
        }
        .item {
            font-size: 24px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 Static Test</h1>
        <div class="checklist">
            <div class="item">✅ HTML работает</div>
            <div class="item">✅ CSS работает</div>
            <div class="item">✅ Страница видна</div>
        </div>
        <p style="margin-top: 40px; font-size: 20px; color: #a0a0b0;">
            Если видите это - статическая страница работает!<br>
            Значит проблема в WASM/Dioxus.
        </p>
    </div>
</body>
</html>
