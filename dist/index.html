    <script>
    // Error catcher — shows errors on screen before WASM loads
    window.__errors = [];
    window.onerror = function(msg, url, line, col, err) {
        window.__errors.push({msg: msg, url: url, line: line, col: col, stack: err && err.stack});
        var box = document.getElementById('error-box');
        if (box) box.style.display = 'block';
        updateErrorBox();
        return false;
    };
    window.onunhandledrejection = function(e) {
        window.__errors.push({msg: 'Unhandled: ' + e.reason, stack: ''});
        var box = document.getElementById('error-box');
        if (box) box.style.display = 'block';
        updateErrorBox();
    };
    function updateErrorBox() {
        var box = document.getElementById('error-box');
        if (!box) return;
        box.innerHTML = '<h3 style="color:#ff4757;margin:0 0 8px">🚨 Errors (' + window.__errors.length + ')</h3>' +
            window.__errors.map(function(e) {
                return '<div style="margin-bottom:8px;font-size:12px;border-bottom:1px solid #333;padding-bottom:4px">' +
                    '<div style="color:#ff4757">' + (e.msg || 'Unknown') + '</div>' +
                    '<div style="color:#888;font-size:10px">' + (e.url||'') + ':' + (e.line||'') + '</div>' +
                    '<pre style="color:#aaa;font-size:10px;margin:4px 0;white-space:pre-wrap">' + (e.stack||'').substring(0,500) + '</pre></div>';
            }).join('');
    }
    // 3D Comet Card tilt effect (matching old React bot exactly)
    document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('mousemove', function(e) {
            if (!e || !e.target) { return; }
            var target = e.target;
            // Find closest element with .comet-card class
            while (target && target !== document) {
                if (target.classList && target.classList.contains('comet-card')) {
                    var card = target;
                    var rect = card.getBoundingClientRect();
                    var x = (e.clientX - rect.left) / rect.width - 0.5;
                    var y = (e.clientY - rect.top) / rect.height - 0.5;
                    card.style.transform = 'perspective(800px) rotateY(' + (x * 12) + 'deg) rotateX(' + (-y * 12) + 'deg) scale3d(1.02, 1.02, 1.02)';
                    return;
                }
                target = target.parentNode;
            }
        });
        document.addEventListener('mouseleave', function(e) {
            if (!e || !e.target) { return; }
            var target = e.target;
            while (target && target !== document) {
                if (target.classList && target.classList.contains('comet-card')) {
                    target.style.transform = '';
                    return;
                }
                target = target.parentNode;
            }
        }, true);
    });
    </script>

    <script>
        // WASM load tracker — shows granular progress and handles failures
        (function() {
            var step = 0;
            var steps = ['Загрузка JS…', 'Загрузка WASM…', 'Компиляция…', 'Запуск…'];
            var stepEl = document.getElementById('loader-step');
            var barEl = document.getElementById('loader-progress-bar');
            function setProgress(pct, text) {
                if (barEl) barEl.style.width = pct + '%';
                if (stepEl && text) stepEl.textContent = text;
            }
            setProgress(10, steps[0]);

            window.addEventListener('TrunkApplicationStarted', function() {
                setProgress(100, 'Готово!');
                setTimeout(function() {
                    var preloader = document.getElementById('preloader');
                    if (preloader) preloader.classList.add('hidden');
                }, 300);
            });

            // Advance steps on a timer if Trunk hasn't fired yet
            var stepTimer = setInterval(function() {
                step++;
                if (step < steps.length) {
                    setProgress(10 + step * 20, steps[step]);
                }
                if (step >= steps.length) clearInterval(stepTimer);
            }, 1500);

            // 10-second fail-safe: if WASM never starts, show diagnostic overlay
            setTimeout(function() {
                var preloader = document.getElementById('preloader');
                if (preloader && !preloader.classList.contains('hidden')) {
                    var ua = navigator.userAgent || '';
                    var platform = navigator.platform || '';
                    var isIOS = /iPad|iPhone|iPod/.test(ua) || (platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                    var diag = document.createElement('div');
                    diag.style.cssText = 'position:fixed;inset:0;background:#0f0f1a;color:#e8e8e8;padding:24px;font-family:monospace;font-size:13px;z-index:100000;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;';

                        '<div style="background:#1a1a2e;padding:12px;border-radius:8px;margin-bottom:16px;text-align:left;font-size:11px;max-width:320px;">' +
                        '<div>platform: ' + platform + '</div>' +
                        '<div>ios: ' + isIOS + '</div>' +
                        '<div>userAgent: ' + ua.substring(0,80) + '…</div>' +
                        '</div>' +
                        '<button id="reload-btn" style="padding:10px 20px;background:#39ff14;color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer;">Перезагрузить</button>';
                    document.body.appendChild(diag);
                    document.getElementById('reload-btn').onclick = function() { location.reload(); };
                }
            }, 10000);
        })();
    </script>
