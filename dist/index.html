    <script>
    // Telegram lifecycle: keep the mini-app EXPANDED with a dark header/background
    // so it doesn't "go dark"/collapse when you switch apps or return from
    // background. iOS WebViews drop the rendered frame on resume; re-applying on
    // visibilitychange/focus keeps it full-screen and themed instead of a blank
    // frame. All wrapped in try/catch for older Telegram clients / plain browser.
    (function () {
      function applyTg() {
        var w = window.Telegram && window.Telegram.WebApp;
        if (!w) return;
        try { w.ready(); } catch (e) {}
        try { w.expand(); } catch (e) {}
        try { w.setBackgroundColor('#0f0f1a'); } catch (e) {}
        try { w.setHeaderColor('#0f0f1a'); } catch (e) {}
        try { if (w.disableVerticalSwipes) w.disableVerticalSwipes(); } catch (e) {}
      }
      applyTg();
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) applyTg();
      });
      window.addEventListener('focus', applyTg);
      window.addEventListener('pageshow', applyTg);
    })();
    </script>

    <script>
    // Cycle #170: Telegram/WebView aggressively caches index.html across deploys.
    // A stale HTML loads an old JS hash, which requests old wasm-bindgen snippets
    // that no longer exist, producing:
    //   "SyntaxError: Importing binding name 'get_select_data' is not found."
    // Fetch the live build version from /version.txt and, if it differs from the
    // JS hash embedded in this HTML, clear caches and move to a versioned URL.
    // The hash fragment (#tgWebAppData=...) is preserved; this is a client-side
    // navigation, not an HTTP redirect, so it does not drop initData.
    (function () {
      function clearAndGo(targetVersion) {
        try { sessionStorage.setItem('__wwb_version_redirected', '1'); } catch (e) {}
        if (window.caches) {
          try {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function () {});
          } catch (e) {}
        }
        try { localStorage.clear(); } catch (e) {}
        var url = new URL(location.href);
        url.searchParams.set('v', targetVersion);
        location.replace(url.toString());
      }
      try {
        if (sessionStorage.getItem('__wwb_version_redirected')) return;
        var moduleScript = document.querySelector('script[type="module"]');
        var match = moduleScript && moduleScript.textContent.match(/\/woody-weed-bot-([a-f0-9]+)\.js/);
        var localVersion = match ? match[1] : '';
        fetch('/version.txt?cb=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
          .then(function (r) {
            if (!r.ok) throw new Error(r.status);
            var ct = (r.headers.get('content-type') || '').toLowerCase();
            if (ct.indexOf('text/plain') === -1) throw new Error('bad content-type: ' + ct);
            return r.text();
          })
          .then(function (serverVersion) {
            serverVersion = (serverVersion || '').trim();
            // Ignore non-hash responses (e.g. dev server returning index.html for /version.txt).
            if (!serverVersion || !/^[a-f0-9]{16,}$/i.test(serverVersion)) return;
            if (localVersion && localVersion === serverVersion) return;
            // Embedded JS hash differs from the server's current build: this page is stale.
            clearAndGo(serverVersion);
          })
          .catch(function (e) {
            // Version check is best-effort. If the module later fails, the
            // error box offers a manual clear-cache button.
            console.error('version check failed', e);
          });
      } catch (e) {
        console.error('version check error', e);
      }
    })();

        if (box) box.style.display = 'block';

    window.onunhandledrejection = function(e) {

    };
    function updateErrorBox() {
        var box = document.getElementById('error-box');
        if (!box) return;
        var hasImportError = window.__errors.some(function (e) {
            var msg = (e.msg || '').toString();
            return msg.indexOf('get_select_data') !== -1 || msg.indexOf('get_form_data') !== -1 || msg.indexOf('SyntaxError') !== -1;
        });
        box.innerHTML = '<h3 style="color:#ff4757;margin:0 0 8px">🚨 Errors (' + window.__errors.length + ')</h3>' +

                    '<pre style="color:#aaa;font-size:10px;margin:4px 0;white-space:pre-wrap">' + (e.stack||'').substring(0,500) + '</pre></div>';

            (hasImportError ? '<div style="margin-top:12px;padding-top:8px;border-top:1px solid #333">' +
                '<p style="color:#aaa;font-size:11px;margin:0 0 8px">Старый кеш Telegram может загружать устаревшие файлы. Попробуй очистить кеш и перезагрузить.</p>' +
                '<button id="clear-cache-btn" style="padding:8px 16px;background:#39ff14;color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer;">Очистить кеш и перезагрузить</button>' +
                '</div>' : '');
        var btn = document.getElementById('clear-cache-btn');
        if (btn) {
            btn.onclick = function () {
                fetch('/version.txt?cb=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
                    .then(function (r) {
                        if (!r.ok) throw new Error(r.status);
                        var ct = (r.headers.get('content-type') || '').toLowerCase();
                        if (ct.indexOf('text/plain') === -1) throw new Error('bad content-type: ' + ct);
                        return r.text();
                    })
                    .then(function (v) {
                        var version = ((v || '').trim().match(/^[a-f0-9]{16,}$/i) || [])[0] || Date.now().toString();
                        try { sessionStorage.setItem('__wwb_version_redirected', '1'); } catch (e) {}
                        if (window.caches) {
                            try {
                                caches.keys().then(function (keys) {
                                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                                }).catch(function(){}).finally(function () {
                                    var url = new URL(location.href);
                                    url.searchParams.set('v', version);
                                    location.replace(url.toString());
                                });
                            } catch (e) {
                                var url = new URL(location.href);
                                url.searchParams.set('v', version);
                                location.replace(url.toString());
                            }
                        } else {
                            var url = new URL(location.href);
                            url.searchParams.set('v', version);
                            location.replace(url.toString());
                        }
                    })
                    .catch(function () {
                        var url = new URL(location.href);
                        url.searchParams.set('v', Date.now().toString());
                        location.replace(url.toString());
                    });
            };
        }
    }
    // 3D Comet Card tilt effect (matching old React bot exactly)
    document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('mousemove', function(e) {
            if (!e || !e.target) { return; }
            var target = e.target;
            // Find closest element with .comet-card class
            while (target && target !== document) {
                if (target.classList && target.classList.contains('comet-card')) {
                    var card = target;
                    var rect = card.getBoundingClientRect();
                    var x = (e.clientX - rect.left) / rect.width - 0.5;
                    var y = (e.clientY - rect.top) / rect.height - 0.5;
                    card.style.transform = 'perspective(800px) rotateY(' + (x * 12) + 'deg) rotateX(' + (-y * 12) + 'deg) scale3d(1.02, 1.02, 1.02)';
                    return;
                }
                target = target.parentNode;
            }
        });
        document.addEventListener('mouseleave', function(e) {
            if (!e || !e.target) { return; }
            var target = e.target;
            while (target && target !== document) {
                if (target.classList && target.classList.contains('comet-card')) {
                    target.style.transform = '';
                    return;
                }
                target = target.parentNode;
            }
        }, true);
    });

    <script>
        // WASM load tracker — shows granular progress and handles failures
        (function() {
            var step = 0;
            var steps = ['Загрузка JS…', 'Загрузка WASM…', 'Компиляция…', 'Запуск…'];
            var stepEl = document.getElementById('loader-step');
            var barEl = document.getElementById('loader-progress-bar');
            function setProgress(pct, text) {
                if (barEl) barEl.style.width = pct + '%';
                if (stepEl && text) stepEl.textContent = text;
            }
            setProgress(10, steps[0]);

            window.addEventListener('TrunkApplicationStarted', function() {
                setProgress(100, 'Готово!');
                setTimeout(function() {
                    var preloader = document.getElementById('preloader');
                    if (preloader) preloader.classList.add('hidden');
                }, 300);
            });

            // Advance steps on a timer if Trunk hasn't fired yet
            var stepTimer = setInterval(function() {
                step++;
                if (step < steps.length) {
                    setProgress(10 + step * 20, steps[step]);
                }
                if (step >= steps.length) clearInterval(stepTimer);
            }, 1500);

            // 30-second fail-safe: WASM compilation on macOS WebKit for a 2.7MB
            // binary can take 15–25s on older hardware. Cycle #169: raised from
            // 10s after production reports of premature timeout on MacIntel.
            setTimeout(function() {
                var preloader = document.getElementById('preloader');
                if (preloader && !preloader.classList.contains('hidden')) {
                    var ua = navigator.userAgent || '';
                    var platform = navigator.platform || '';
                    var isIOS = /iPad|iPhone|iPod/.test(ua) || (platform === 'MacIntel' && navigator.maxTouchPoints > 1);

                    diag.style.cssText = 'position:fixed;inset:0;background:#0f0f1a;color:#e8e8e8;padding:24px;font-family:monospace;font-size:13px;z-index:100000;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;';
                    diag.innerHTML = '<h2 style="color:#ff4757;margin-bottom:12px;">⚠️ Не удалось загрузить приложение</h2>' +
                        '<p style="max-width:320px;margin-bottom:16px;">WASM не запустился за 30 секунд. Попробуй перезагрузить или проверь соединение.</p>' +
                        '<div style="background:#1a1a2e;padding:12px;border-radius:8px;margin-bottom:16px;text-align:left;font-size:11px;max-width:320px;">' +
                        '<div>platform: ' + platform + '</div>' +
                        '<div>ios: ' + isIOS + '</div>' +
                        '<div>userAgent: ' + ua.substring(0,80) + '…</div>' +
                        '</div>' +
                        '<button id="reload-btn" style="padding:10px 20px;background:#39ff14;color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer;">Перезагрузить</button>';
                    document.body.appendChild(diag);
                    document.getElementById('reload-btn').onclick = function() { location.reload(); };
                }
            }, 30000);
        })();

<script>"use strict";

(function () {

    const address = '{{__TRUNK_ADDRESS__}}';
    const base = '{{__TRUNK_WS_BASE__}}';
    let protocol = '';
    protocol =
        protocol
            ? protocol
            : window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
    const url = protocol + '://' + address + base + '.well-known/trunk/ws';

    class Overlay {
        constructor() {
            // create an overlay
            this._overlay = document.createElement("div");
            const style = this._overlay.style;
            style.height = "100vh";
            style.width = "100vw";
            style.position = "fixed";
            style.top = "0";
            style.left = "0";
            style.backgroundColor = "rgba(222, 222, 222, 0.5)";
            style.fontFamily = "sans-serif";
            // not sure that's the right approach
            style.zIndex = "1000000";
            style.backdropFilter = "blur(1rem)";

            const container = document.createElement("div");
            // center it
            container.style.position = "absolute";
            container.style.top = "30%";
            container.style.left = "15%";
            container.style.maxWidth = "85%";

            this._title = document.createElement("div");
            this._title.innerText = "Build failure";
            this._title.style.paddingBottom = "2rem";
            this._title.style.fontSize = "2.5rem";

            this._message = document.createElement("div");
            this._message.style.whiteSpace = "pre-wrap";

            const icon= document.createElement("div");
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';
            this._title.prepend(icon);

            container.append(this._title, this._message);
            this._overlay.append(container);

            this._inject();
            window.setInterval(() => {
                this._inject();
            }, 250);
        }

        set reason(reason) {
            this._message.textContent = reason;
        }

        _inject() {
            if (!this._overlay.isConnected) {
                // prepend it
                document.body?.prepend(this._overlay);
            }
        }

    }

    class Client {
        constructor(url) {
            this.url = url;
            this.poll_interval = 5000;
            this._overlay = null;
        }

        start() {
            const ws = new WebSocket(this.url);
            ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                switch (msg.type) {
                    case "reload":
                        this.reload();
                        break;
                    case "buildFailure":
                        this.buildFailure(msg.data)
                        break;
                }
            };
            ws.onclose = () => this.onclose();
        }

        onclose() {
            window.setTimeout(
                () => {
                    // when we successfully reconnect, we'll force a
                    // reload (since we presumably lost connection to
                    // trunk due to it being killed, so it will have
                    // rebuilt on restart)
                    const ws = new WebSocket(this.url);
                    ws.onopen = () => window.location.reload();
                    ws.onclose = () => this.onclose();
                },
                this.poll_interval);
        }

        reload() {
            window.location.reload();
        }

        buildFailure({reason}) {
            // also log the console
            console.error("Build failed:", reason);

            console.debug("Overlay", this._overlay);

            if (!this._overlay) {
                this._overlay = new Overlay();
            }
            this._overlay.reason = reason;
        }
    }

    new Client(url).start();

})()
